# Security baseline: runs on every PR, on pushes to the default branch and weekly,
# so newly published CVEs are caught even when nobody touches the code.
# All third-party actions are pinned to a commit SHA (supply-chain protection);
# Dependabot keeps those pins up to date.
name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Leaked secrets (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan git history for credentials
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --results=verified,unknown

  trivy:
    name: Vulnerabilities & misconfigurations (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Known-vulnerable dependencies and secrets (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: IaC / Dockerfile / Kubernetes / Helm misconfigurations
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          skip-setup-trivy: true
          exit-code: "1"

  semgrep:
    name: Insecure code patterns (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: pipx install semgrep==1.185.0
      - name: Scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          semgrep scan --error --metrics=off
          --severity ERROR --severity WARNING
          --config p/default --config p/secrets --config p/typescript --config p/dockerfile --config p/kubernetes
          src e2e Dockerfile charts

  dependencies:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fail on high/critical advisories in shipped dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  claude-review:
    name: AI security review (Claude)
    # Same-repo PRs only: never hand the API key to code from a fork.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check that ANTHROPIC_API_KEY is configured
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ANTHROPIC_API_KEY secret not set - skipping Claude security review"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-11
        if: steps.key.outputs.present == 'true'
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          comment-pr: true
          custom-security-scan-instructions: .github/security-review-instructions.txt
